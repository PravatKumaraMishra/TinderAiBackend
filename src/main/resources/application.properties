spring.application.name=tinder-ai-backend

spring.mongodb.uri=${DATASOURCE_URL}

spring.ai.openai.base-url=${LLM_BASE_URL}
spring.ai.openai.chat.model=${CHAT_MODEL}
spring.ai.openai.api-key=${LLM_API_KEY}
spring.ai.openai.timeout=${LLM_TIMEOUT}
spring.ai.openai.chat.max-retries=${LLM_MAX_RETRY}

pollinations.api-key=${POLLINATIONS_API_KEY:}
pollinations.image-model=${POLLINATIONS_IMAGE_MODEL:community/scriptsnsenses-sys/flux-2-dev-free}

# Default generation settings; individual API requests may override each field.
tinderai.minAge=${MIN_AGE:18}
tinderai.maxAge=${MAX_AGE:35}
tinderai.ethnicities=${ETHNICITIES:Indian}

# A stable Base64 secret containing at least 32 random bytes is required.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:tinder-ai-backend}
security.jwt.audience=${JWT_AUDIENCE:tinder-ai-api}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:30m}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://tinder.pravat.me}
security.google.client-id=${GOOGLE_CLIENT_ID:}
spring.data.mongodb.auto-index-creation=true

# Enable only for a controlled one-time migration after registering the owner.
migration.legacy.enabled=${MIGRATE_LEGACY_DATA:false}
migration.legacy.owner-email=${LEGACY_OWNER_EMAIL:}
migration.legacy.old-profile-id=${LEGACY_USER_PROFILE_ID:user}

# Comma-separated account IDs allowed to generate AI personas. Empty disables admin access.
security.admin.user-ids=${ADMIN_USER_IDS:}

# Use COOKIE_SECURE=false only for local HTTP development.
security.refresh.ttl=${REFRESH_TOKEN_TTL:7d}
security.refresh.cookie-secure=${COOKIE_SECURE:true}
security.refresh.same-site=${COOKIE_SAME_SITE:Lax}

# S3-compatible Cloudflare R2 storage for all new profile pictures.
storage.r2.endpoint=${R2_ENDPOINT:}
storage.r2.access-key=${R2_ACCESS_KEY_ID:}
storage.r2.secret-key=${R2_SECRET_ACCESS_KEY:}
storage.r2.bucket=${R2_BUCKET:}
storage.r2.public-url=${R2_PUBLIC_URL:}
